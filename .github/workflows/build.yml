name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Keystore persistente (generato al primo run)
        run: |
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore -alias viandante \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass viandante123 -keypass viandante123 \
              -dname "CN=Viandante, OU=peppedess, O=peppedess, L=Milano, C=IT"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/release.keystore
            git commit -m "Aggiungi keystore persistente [skip ci]"
            git push
          fi

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Viandante-APK
          path: app/build/outputs/apk/release/app-release.apk
